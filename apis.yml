aid: dopl-technologies
name: dopl technologies
description: >-
  Dopl Technologies is a Seattle-based data and AI company (founded 2022,
  Techstars-backed) democratizing access to diagnostic exams and interventional
  procedures through telerobotic ultrasound. Its Dopl Traverse platform and
  SonoFlex app let a remote sonographer operate an ultrasound probe over a
  network from significant distances, extending specialist-level imaging into
  rural and workforce-constrained regions. Field testing in rural Washington
  hospitals has reduced patient wait times by over 90 percent. The company cites
  50M+ missed ultrasound exams annually and $19.5B in lost revenue from unequal
  imaging access, and expects FDA clearance in 2027 before expanding into
  minimally invasive procedures. As of this profile the company publishes no
  public API, SDK, developer portal, or API documentation; this record is a
  network stub maintained for discovery and future enrichment.
